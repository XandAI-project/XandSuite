name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  # ── Build matrix ────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — AppImage + .deb
          - platform: ubuntu-22.04
            args: "--target x86_64-unknown-linux-gnu"
            label: Linux

          # Windows — NSIS installer
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc"
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ──────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── Rust ─────────────────────────────────────────────────────────────
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'ubuntu-22.04' && 'x86_64-unknown-linux-gnu' || 'x86_64-pc-windows-msvc' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # ── Linux system dependencies ─────────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # ── Install npm dependencies ──────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── Build with Tauri ──────────────────────────────────────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          releaseName: "XandSuite ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            ## XandSuite ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

            ### Downloads
            | Platform | File | Notes |
            |----------|------|-------|
            | Windows  | `XandSuite_*_x64-setup.exe` | NSIS installer |
            | Linux    | `xandsuite_*_amd64.AppImage` | Portable, no install needed |
            | Linux    | `xandsuite_*_amd64.deb` | Debian/Ubuntu package |

            ### Requirements
            - **Windows**: Windows 10 or later (x64)
            - **Linux**: Ubuntu 22.04+ or any distro with WebKit2GTK 4.1
            - **TTS (optional)**: Python 3.10+ for voice output (KokoroTTS)
            - **Voice input (optional)**: Whisper binary (downloadable from Settings)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
